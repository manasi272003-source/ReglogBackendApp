server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reglog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:reglog}
spring.datasource.password=${DB_PASSWORD:reglog_local_only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
reglog.jwt.secret=${JWT_SECRET:}
reglog.jwt.minutes=${JWT_MINUTES:60}
reglog.web-origin=${REGLOG_ORIGIN:http://localhost:5173}
reglog.otp.minutes=${OTP_MINUTES:10}
reglog.otp.sender=${OTP_SENDER:no-reply@example.invalid}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true

